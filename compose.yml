# Compose validates these before creating resources. Legacy credentials must
# select their existing volume; current installs still need a separate admin key.
x-upgrade-checks:
  admin-password: ${POSTGRES_APP_PASSWORD:-${POSTGRES_ADMIN_PASSWORD:?Use the Docker setup command in README.md first}}
  legacy-volume: ${POSTGRES_APP_PASSWORD:+${POSTGRES_DATA_VOLUME:?Set POSTGRES_DATA_VOLUME to the existing volume key; see docs/SETUP.md}}

services:
  app:
    image: ${IRANG_IMAGE:-ghcr.io/madrobotnet/irang:2.3.2}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://second_brain:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?Use the Docker setup command in README.md first}}@db:5432/second_brain}
      SETUP_TOKEN: ${SETUP_TOKEN:?Use the Docker setup command in README.md first}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      ARO_MCP_ALLOWED_HOSTS: ${ARO_MCP_ALLOWED_HOSTS:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/app/.data/attachments}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_JEV_MODEL: ${TYPESAFE_JEV_MODEL:-jev-latest}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      CODEX_HOME: ${CODEX_HOME:-/app/.data/auth/codex}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6.1-sol}
      CODEX_CHATGPT_BASE_URL: ${CODEX_CHATGPT_BASE_URL:-https://chatgpt.com/backend-api/codex}
      GEMINI_CLI_HOME: ${GEMINI_CLI_HOME:-/app/.data/auth/google}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/app/.data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Use the Docker setup command in README.md first}}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?Use the Docker setup command in README.md first}}
      POSTGRES_DB: second_brain
    volumes:
      - ${POSTGRES_DATA_VOLUME:-postgres-data}:/var/lib/postgresql
      - ./docker/postgres/production:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d second_brain"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  postgres-data:
  second_brain_pg18:
