name: Feature request
description: Describe a concrete need and how you'll know it's met.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests before submitting. Explain how the change fits a self-hosted notebook for one owner.
        Deployment questions belong in [Support](https://github.com/madrobotnet/aro/blob/main/SUPPORT.md). Report vulnerabilities privately using [Security](https://github.com/madrobotnet/aro/blob/main/SECURITY.md), not this form.

        Reports may become public. Use invented examples, not private notes. Never include passwords or hashes, installation codes, full env files or logs, rendered Compose config, cookies, authorization headers, provider auth files, AI keys or tokens, or database backups.
  - type: checkboxes
    id: safe-request
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues for this request.
          required: true
        - label: This isn't a vulnerability report, deployment question, or request for provider account access.
          required: true
        - label: I've removed secrets, auth files, full env files or logs, and private notes from all fields and attachments.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The task you can't complete
      description: Describe what you're trying to do and where the current workflow falls short. Use invented content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the user should be able to do. Include any effect on stored data, AI consent, or deployment.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: How to tell it works
      description: Describe an observable result or give a short example using invented data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Mention workarounds or simpler changes you've considered. Don't attach private notes, full logs, or configuration dumps.
    validations:
      required: false
